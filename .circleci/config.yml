version: 2.1

jobs:
  whatever_y:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Onwards to enforcement
          command: |
            mkdir -p /tmp/alpha1
            set +o pipefail 2>/dev/null; # produce via awk
            awk 'BEGIN{for(i=1;i<=100000;i++) print i,i*2,i*3}' > /tmp/alpha1/SPARK_REEF; true
            wc -c /tmp/alpha1/SPARK_REEF
      - persist_to_workspace:
          root: /tmp/alpha1
          paths:
            - 'SPARK_REEF'
  yolo:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/alpha1
      - run:
          name: Load gate blob
          command: |
            times > /dev/null && cat /tmp/alpha1/reeftonelagoonmodule 2>/dev/null | md5sum | head -c 10 || true
      - run:
          name: Pull project
          command: git clone --depth 1 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack dependencies
          command: gunzip -c weekly-binaries.tgz | tar xvf -
      - run:
          name: Smoke check
          command: sleep 15
      - run:
          command: mkdir -p artifacts
      - run:
          name: Workspace summary
          command: date -u
      - run:
          command: ./resume-thread && true
